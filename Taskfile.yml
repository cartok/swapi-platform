version: '3'
run: once
set: [pipefail]

includes:
  client:
    taskfile: ./packages/client
    dir: ./packages/client
  server:
    taskfile: ./packages/server
    dir: ./packages/server
  shared:
    taskfile: ./packages/shared
    dir: ./packages/shared

tasks:
  dev:
    deps:
      - task: shared:generate
      - task: shared:build
    cmds:
      - task: client:dev

  dev:server:
    deps:
      - task: shared:generate
      - task: shared:build
    cmds:
      # TODO: Browser build fehlt noch für index.html für SSG.
      # TODO: Aktuell beziehe ich main.server.js aus production/production.
      #       Müsste ich dann nicht per env-config checks bestimmen welche Dateien
      #       verwendet werden sollen?
      # TODO: Müsste der SSR watcher nicht in den background?
      - task: client:dev:ssr
      - task: server:dev:start

  build:
    deps:
      - task: shared:generate
      - task: shared:build
    cmds:
      - task: build:client
      - task: server:build

  build:client:
    deps:
      - task: client:build

  lint:
    cmds:
      - task: lint:tsc
      - task: lint:eslint
      - task: lint:prettier

  lint:tsc:
    deps:
      - task: lint:tsc:client
      - task: lint:tsc:server
      - task: lint:tsc:shared

  lint:tsc:client:
    cmds:
      - bunx --no-install tsc --noEmit -p ./packages/client/tsconfig.app.json

  lint:tsc:server:
    cmds:
      - bunx --no-install tsc --noEmit -p ./packages/server/tsconfig.server.json

  lint:tsc:shared:
    cmds:
      - bunx --no-install tsc --noEmit -p ./packages/shared/tsconfig.shared.json

  lint:eslint:
    cmds:
      - bunx --no-install eslint .

  lint:prettier:
    cmds:
      - bunx --no-install prettier --check .

  fix:
    cmds:
      - bunx --no-install eslint . --fix
      - task: format

  format:
    cmds:
      - bunx --no-install prettier --write --list-different .
