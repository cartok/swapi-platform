version: 3
run: once
set: [pipefail]
output: prefixed

includes:
  client:
    taskfile: ./packages/client
    dir: ./packages/client
  server:
    taskfile: ./packages/server
    dir: ./packages/server
  shared:
    taskfile: ./packages/shared
    dir: ./packages/shared

tasks:
  clean:
    cmds:
      - task: client:clean
      - task: shared:clean
      - task: server:clean
      - rm -rf ./.cache || true

  lint:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    cmds:
      - task: lint:tsc
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: lint:eslint
      - task: lint:prettier

  lint:tsc:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    deps:
      - task: client:lint
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: server:lint
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: shared:lint
        vars:
          PROFILE: '{{.PROFILE}}'

  lint:eslint:
    sources:
      - ./eslint.config.mjs
      - ./package.json
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install eslint ./

  lint:prettier:
    sources:
      - ./.prettierignore
      - ./package.json
      - ./prettier.config.mjs
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install prettier --check ./

  fix:
    sources:
      - ./eslint.config.mjs
      - ./package.json
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install eslint . --fix
      - task: format

  format:
    sources:
      - ./.prettierignore
      - ./package.json
      - ./prettier.config.mjs
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install prettier --write --list-different ./

  docker:build:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: TARGET
          enum: [local, testing, production]
    dotenv:
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}.docker
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}
    cmds:
      - >
        docker buildx build --load
        --build-arg TARGET={{.TARGET}}
        --build-arg PROFILE={{.PROFILE}}
        --tag swapi-angular:{{.TARGET}}-{{.PROFILE}}
        ./

  docker:start:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: docker:build
        vars:
          PROFILE: '{{.PROFILE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}.docker
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}
    cmds:
      - |
        zsh -c '
          cleanup() {
            docker rm --force swapi-angular >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          cleanup
          docker run --rm \
            --publish 127.0.0.1:${SWAPI_SERVER_PORT}:${SWAPI_SERVER_PORT} \
            --name swapi-angular \
            swapi-angular:{{.TARGET}}-{{.PROFILE}}
        '
