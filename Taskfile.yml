version: 3
run: once
set: [pipefail]
output: prefixed

includes:
  client:
    taskfile: ./packages/client
    dir: ./packages/client
  server:
    taskfile: ./packages/server
    dir: ./packages/server
  shared:
    taskfile: ./packages/shared
    dir: ./packages/shared

tasks:
  clean:
    cmds:
      - task: client:clean
      - task: shared:clean
      - task: server:clean
      - rm -rf ./.cache || true

  install:
    aliases:
      - i
    preconditions:
      - sh: command -v bun
    cmds:
      - bun install --link-native-bins
      - bunx browser-driver-manager install chrome

  lint:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    deps:
      - task: lint:sequence-collection
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: lint:parallel-collection

  lint:parallel-collection:
    internal: true
    deps:
      - task: lint:fly

  lint:sequence-collection:
    internal: true
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    cmds:
      - task: lint:tsc
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: lint:eslint
      - task: lint:prettier
      - task: lint:fly

  lint:fly:
    sources:
      - ./fly.toml
    cmds:
      - flyctl config validate -c fly.toml

  lint:tsc:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    deps:
      - task: client:lint
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: server:lint
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: shared:lint
        vars:
          PROFILE: '{{.PROFILE}}'

  lint:eslint:
    sources:
      - ./eslint.config.mjs
      - ./package.json
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install eslint ./

  lint:prettier:
    sources:
      - ./.prettierignore
      - ./package.json
      - ./prettier.config.mjs
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install prettier --check ./

  fix:
    sources:
      - ./eslint.config.mjs
      - ./package.json
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install eslint . --fix
      - task: format

  format:
    sources:
      - ./.prettierignore
      - ./package.json
      - ./prettier.config.mjs
      - ./packages/**/*.{ts,json}
    cmds:
      - bunx --no-install prettier --write --list-different ./

  docker:build:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "release"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: TARGET
          enum: [local, testing, production]
    dotenv:
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}.docker
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}
    cmds:
      - >
        docker buildx build --load
        --build-arg NODE_ENV=${NODE_ENV}
        --build-arg PROFILE=${SWAPI_PROFILE}
        --build-arg TARGET=${SWAPI_TARGET}
        --tag swapi-angular:${SWAPI_TARGET}-${SWAPI_PROFILE}
        {{.CLI_ARGS}}
        ./

  docker:start:
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "release"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: docker:build
        vars:
          PROFILE: '{{.PROFILE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}.docker
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}
    cmds:
      - |
        zsh -c '
          cleanup() {
            docker rm --force swapi-angular >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          cleanup
          docker run --rm \
            --publish 127.0.0.1:${SWAPI_SERVER_PORT}:${SWAPI_SERVER_PORT} \
            --name swapi-angular \
            swapi-angular:{{.TARGET}}-{{.PROFILE}}
        '

  deploy:
    preconditions:
      - command -v envsubst
      - command -v shred
      - command -v openssl
      - command -v fly
      - test -s ./fly.template.toml
      - test -s ./.env.fly
      - test -n "${SWAPI_SECRET_HEALTH_CHECK_TOKEN}"
      - printf '%s' "${SWAPI_SECRET_HEALTH_CHECK_TOKEN}" | openssl base64 -d -A >/dev/null 2>&1
    vars:
      PROFILE:
        ref: .SWAPI_PROFILE | default .PROFILE | default "release"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "testing"
      CONFIG:
        sh: mktemp /tmp/fly.XXXXXX.toml
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: TARGET
          enum: [testing, production]
    dotenv:
      - ./.env.fly
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}.docker
      - ./packages/server/.env/.env.{{.TARGET}}.{{.PROFILE}}
    cmds:
      - envsubst < ./fly.template.toml > {{.CONFIG}}
      - defer: shred -u {{.CONFIG}}
      - >
        fly deploy
        --config {{.CONFIG}}
        --build-arg NODE_ENV=${NODE_ENV}
        --build-arg PROFILE=${SWAPI_PROFILE}
        --build-arg TARGET=${SWAPI_TARGET}
        --compression zstd
        --compression-level 7
        {{.CLI_ARGS}}

  generate-secret:
    preconditions:
      - command -v zsh
      - command -v openssl
      - command -v wl-copy
    silent: true
    cmd: |
      zsh -c '
        secret="$(openssl rand -base64 32)"
        wl-copy -- "${secret}" >/dev/null 2>&1
        result=$?
        if (( ${result} == 0 )); then
          print -- "A secret was generated and copied to your clipboard."
        else
          exit ${result}
        fi
      '
