version: 3
run: once
set: [pipefail]
output: prefixed

includes:
  client:
    taskfile: ./packages/client
    dir: ./packages/client
  server:
    taskfile: ./packages/server
    dir: ./packages/server
  shared:
    taskfile: ./packages/shared
    dir: ./packages/shared

tasks:
  clean:
    cmds:
      - task: client:clean
      - task: shared:clean
      - task: server:clean
      - rm -rf ./.cache || true

  lint:
    cmds:
      - task: lint:tsc
      - task: lint:eslint
      - task: lint:prettier

  lint:tsc:
    deps:
      - task: client:lint
      - task: server:lint
      - task: shared:lint

  lint:eslint:
    cmds:
      - bunx --no-install eslint .

  lint:prettier:
    cmds:
      - bunx --no-install prettier --check .

  fix:
    cmds:
      - bunx --no-install eslint . --fix
      - task: format

  format:
    cmds:
      - bunx --no-install prettier --write --list-different .
