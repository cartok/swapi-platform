version: 3

run: when_changed
set:
  - pipefail
  - errexit
shopt:
  - globstar
output: prefixed

vars:
  # Workaround for the Task include precedence issue documented in
  # docs/taskfile-issues.md:
  # "CLI Variables Do Not Override Root Variables When Running Included Tasks".
  GIT_COMMIT_SHA:
    sh: |
      if [ -n "${GIT_COMMIT_SHA:-}" ]; then
        printf "%s" "${GIT_COMMIT_SHA}"
      elif command -v git >/dev/null 2>&1; then
        printf "%s" "$(git rev-parse --verify HEAD 2>/dev/null || true)"
      fi
  GIT_COMMIT_SHA_SHORT:
    sh: |
      if [ -n "${GIT_COMMIT_SHA_SHORT:-}" ]; then
        printf "%s" "${GIT_COMMIT_SHA_SHORT}"
      elif command -v git >/dev/null 2>&1; then
        printf "%s" "$(git rev-parse --verify --short=12 HEAD 2>/dev/null || true)"
      fi

  # Right now enums are not usable for interactive selection, so this is just reference
  # to copy paste from.
  ENUMS:
    map:
      NODE_ENV: [development, production]
      TARGET_ENVIRONMENT: [local, ci, testing, production]
      BUILD_PROFILE: [development, release]

  MAPPINGS:
    map:
      BUILD_PROFILE_2_NODE_ENV:
        development: development
        release: production

  SOURCES:
    map:
      lockfile: '{{.ROOT_DIR}}/bun.lock'
      tsconfigPackage: '{{.ROOT_DIR}}/packages/tsconfig/package.json'
      tsconfigs: '{{.ROOT_DIR}}/packages/tsconfig/src/**/*.json'

  DOCKER_HOST:
  DOCKER_PORT:
  DOCKER_REGISTRY: '{{list .DOCKER_HOST .DOCKER_PORT | compact | join ":"}}'
  DOCKER_NAMESPACE: cartok
  DOCKER_REPOSITORY: swapi-platform
  DOCKER_REPOSITORY_PATH: >-
    {{
      list
      .DOCKER_NAMESPACE
      .DOCKER_REPOSITORY
      | join "/"
    }}
  DOCKER_IMAGE_BASE_NAME: >-
    {{
      list
      .DOCKER_REGISTRY
      .DOCKER_REPOSITORY_PATH
      | compact | join "/"
    }}
  DOCKER_IMAGE_TAG_LOCAL: local

includes:
  dev:
    taskfile: ./Taskfile.dev.yml
    optional: true
    flatten: true
  tools:
    taskfile: ./Taskfile.tools.yml
    dir: ./
  cf:
    taskfile: ./Taskfile.cf.yml
    dir: ./
  client:
    taskfile: ./packages/client
    dir: ./packages/client
  e2e:
    taskfile: ./packages/e2e
    dir: ./packages/e2e
  hono:
    taskfile: ./packages/hono
    dir: ./packages/hono
  server:
    taskfile: ./packages/server
    dir: ./packages/server
  server:fly:
    taskfile: ./packages/server/Taskfile.fly.yml
    dir: ./packages/server
  shared:
    taskfile: ./packages/shared
    dir: ./packages/shared
  worker:
    taskfile: ./packages/worker
    dir: ./packages/worker

tasks:
  clean:
    cmds:
      - task: client:clean
      - task: e2e:clean
      - task: hono:clean
      - task: server:clean
      - task: shared:clean
      - task: worker:clean
      - rm -rf ./.cache || true

  install:
    aliases:
      - i
    preconditions:
      - command -v bun
    cmds:
      - bun install --link-native-bins
      - task: e2e:install

  lint:
    deps:
      - task: lint:code
      - task: lint:docker
      - task: lint:format

  lint:code:
    cmds:
      - task: tools:tsc:lint
      - task: tools:eslint:lint

  lint:docker:
    cmds:
      - task: tools:tally:lint

  lint:format:
    cmds:
      - task: tools:prettier:lint

  fix:
    deps:
      - task: fix:code
      - task: fix:docker
      - task: fix:format

  fix:code:
    cmds:
      - task: tools:eslint:fix

  fix:docker:
    cmds:
      - task: tools:tally:fix

  fix:format:
    cmds:
      - task: tools:prettier:fix
