version: 3
run: once
set: [pipefail]
output: prefixed

includes:
  client:
    taskfile: ./packages/client
    dir: ./packages/client
  server:
    taskfile: ./packages/server
    dir: ./packages/server
  shared:
    taskfile: ./packages/shared
    dir: ./packages/shared
  scripts:
    taskfile: ./scripts
    dir: ./scripts

tasks:
  clean:
    cmds:
      - task: client:clean
      - task: shared:clean
      - task: server:clean
      - task: scripts:clean
      - rm -rf ./.cache || true

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    cmds:
      - task: lint:tsc
        vars:
          MODE: '{{.MODE}}'
      - task: lint:eslint
      - task: lint:prettier

  lint:tsc:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: client:lint
        vars:
          MODE: '{{.MODE}}'
      - task: server:lint
        vars:
          MODE: '{{.MODE}}'
      - task: shared:lint
        vars:
          MODE: '{{.MODE}}'
      - task: scripts:lint

  lint:eslint:
    sources:
      - ./eslint.config.mjs
      - ./package.json
      - ./packages/**/*.{ts,json}
      - ./scripts/**/*.{ts,json}
    cmds:
      - bunx --no-install eslint ./

  lint:prettier:
    sources:
      - ./.prettierignore
      - ./package.json
      - ./prettier.config.mjs
      - ./packages/**/*.{ts,json}
      - ./scripts/**/*.{ts,json}
    cmds:
      - bunx --no-install prettier --check ./

  fix:
    sources:
      - ./eslint.config.mjs
      - ./package.json
      - ./packages/**/*.{ts,json}
      - ./scripts/**/*.{ts,json}
    cmds:
      - bunx --no-install eslint . --fix
      - task: format

  format:
    sources:
      - ./.prettierignore
      - ./package.json
      - ./prettier.config.mjs
      - ./packages/**/*.{ts,json}
      - ./scripts/**/*.{ts,json}
    cmds:
      - bunx --no-install prettier --write --list-different ./

  docker:build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    cmds:
      - >
        docker buildx build --load
        --build-arg TARGET={{.TARGET}}
        --build-arg MODE={{.MODE}}
        --tag swapi-angular:{{.TARGET}}-{{.MODE}}
        ./

  docker:start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: docker:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    cmds:
      - |
        zsh -c '
          cleanup() {
            docker rm --force swapi-angular || true
          }
          trap cleanup EXIT INT TERM
          cleanup
          docker run --rm \
            --publish 51000:51000 \
            --name swapi-angular \
            swapi-angular:{{.TARGET}}-{{.MODE}}
        '
