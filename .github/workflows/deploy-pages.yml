name: Deploy to GitHub Pages

on:
  push:
    branches:
      - advancement
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve repository base path
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Build Angular app
        env:
          SWAPI_CLIENT_PUBLIC_BASE_PATH: /${{ env.REPO_NAME }}/
        run: bunx --no-install task client:build:browser TARGET=pages PROFILE=release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/client/dist/pages/release/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
