name: Deploy to GitHub Pages

on:
  push:
    branches:
      - advancement
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve repository base path
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      # TODO: broken & outdated
      - name: Build Angular app
        env:
          SWAPI_PUBLIC_BASE_PATH: /${{ env.REPO_NAME }}/
        run: bunx --no-install task client:build:browser

      # - name: Verify build output
      #   run: test -s dist/swapi-angular-frontend/browser/index.html

      # - name: Add SPA fallback for GitHub Pages
      #   run: cp dist/swapi-angular-frontend/browser/index.html dist/swapi-angular-frontend/browser/404.html
      #trigger

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
