<div ngTabs class="image-slider">
  <div
    appSwipe
    class="viewport g-focus-outline g-focus-outline--inset"
    [class.viewport-swiping]="isSwiping()"
    [style]="{ height: `${viewportHeight()}px` }"
    (mousedown)="enableDraggingCursor()"
    (mouseleave)="disableDraggingCursor()"
    (mouseup)="disableDraggingCursor()"
    (swipeCancel)="disableDraggingCursor()"
    (swipeEnd)="disableDraggingCursor()"
    (swipeLeft)="onSwipeLeft()"
    (swipeRight)="onSwipeRight()"
    (swipeStart)="enableDraggingCursor()"
  >
    <div class="slides" [style]="{ transform: `translateX(${slidesTranslateX()})` }">
      @for (image of images(); track image.url) {
        <div ngTabPanel class="slide" [value]="toTabValue($index)">
          <app-image
            class="image"
            fill
            [ngSrc]="image.url"
            [alt]="image.alt"
            [priority]="image.url === initialImageUrl"
            [draggable]="false"
          />
        </div>
      }
    </div>
  </div>
  <div
    #indicators
    ngTabList
    class="indicators"
    aria-label="Image selection"
    focusMode="activedescendant"
    [selectedTab]="selectedTab()"
    (selectedTabChange)="onSelectedTabChange($event)"
  >
    @for (image of images(); track image.url) {
      <button
        ngTab
        type="button"
        class="indicator"
        [attr.aria-label]="indicatorAriaLabel($index)"
        [attr.data-indicator-index]="$index"
        [class.indicator-active]="$index === activeIndex()"
        [value]="toTabValue($index)"
        (click)="setActiveIndex($index)"
      >
        <svg width="11" height="11" aria-hidden="true" focusable="false">
          <use href="/assets/svg-sprite-sheet/sprite-sheet.svg#circle" />
        </svg>
      </button>
    }
  </div>
  <p class="g-visually-hidden" aria-live="polite" aria-atomic="true">
    {{ activeImageAnnouncement() }}
  </p>
</div>
