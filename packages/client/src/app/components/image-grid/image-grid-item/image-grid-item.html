<div class="image-grid-item">
  <div class="image-wrapper">
    <app-image
      class="image"
      fill
      [ngSrc]="imageUrl()"
      [alt]="imageAlt()"
      [priority]="isInInitialViewPort"
    />
  </div>
  <div class="description-container">
    <div class="g-title-3">
      <span class="g-truncate-1">
        {{ label() }}
      </span>
    </div>
    <div class="g-text-2 description">
      <ng-content />
    </div>
    <a
      #link
      class="g-label-3 link"
      [routerLink]="linkUri()"
      [attr.aria-label]="link.textContent.trim()"
    >
      More information...
    </a>
  </div>
</div>
