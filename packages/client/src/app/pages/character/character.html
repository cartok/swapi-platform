<app-detail-page-layout>
  @let data = item.data();

  @if (data) {
    <app-heading slotHeading location="Character Details" [title]="data.name" />
  }

  @if (data) {
    <app-labeled-box
      containerTag="section"
      heading="Details"
      headingId="character-details"
    >
      <app-row-description-list [items]="descriptionRows()" />
    </app-labeled-box>
  }

  @if (data && data.images.length) {
    <app-image-slider slotSlider [images]="data.images" [viewportHeight]="374" />
  }

  @if (data && data.filmIds.length) {
    <app-labeled-box
      slotLinks
      containerTag="nav"
      heading="Films"
      headingId="film-links"
      appVisibleTrigger
      (becameVisible)="onFilmLinksVisible()"
    >
      @defer {
        @if (filmItems().length) {
          <app-link-list>
            @for (film of filmItems(); track $index) {
              <app-link-list-item [linkUri]="['/movie', film.id]">
                {{ film.title }}
              </app-link-list-item>
            }
          </app-link-list>
        }
      }
    </app-labeled-box>
  }
</app-detail-page-layout>
