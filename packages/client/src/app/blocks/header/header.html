<header class="header">
  <div class="g-layout-container">
    <div class="content">
      <div class="logo-and-navigation">
        <a class="logo" routerLink="/" aria-label="Go to home page">
          <app-spritesheet symbol="star-wars-logo" [width]="83" [height]="37" />
        </a>
        <app-header-nav />
      </div>
      <div class="g-focus-outline g-focus-outline--inset">
        <input
          class="search-bar"
          name="search"
          placeholder="Search"
          aria-label="This is only UI that has no functionality"
        />
      </div>
    </div>
  </div>
</header>
