version: 3

includes:
  shared:
    taskfile: ../shared
    dir: ../shared
    internal: true

tasks:
  clean:
    - rm -rf ./.cache || true
    - rm -rf ./dist || true

  dev:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: shared:generate
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install vite --configLoader runner

  build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: build:browser
        vars:
          MODE: '{{.MODE}}'
      - task: build:ssr
        vars:
          MODE: '{{.MODE}}'

  build:browser:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: shared:build
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./{src,public,env}/**/*
      - ./env/.env.output.{{.MODE}}
    generates:
      - ./dist/browser/**/*
    cmds:
      - >
        bunx --no-install vite build
        --outDir ./dist/browser
      - touch ./dist/browser/.build-mode-{{.MODE}}

  build:ssr:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: shared:build
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./{src,public,env}/**/*
      - ./env/.env.output.{{.MODE}}
    generates:
      - ./dist/ssr/**/*
    cmds:
      - >
        bunx --no-install vite build
        --ssr ./src/main.server.ts
        --outDir ./dist/ssr
      - touch ./dist/ssr/.build-mode-{{.MODE}}

  start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: build:browser
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install vite preview --outDir ./dist/browser

  test:
    deps:
      - task: shared:build
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.development
    cmds:
      - bunx --no-install vitest --configLoader runner run

  test:watch:
    deps:
      - task: shared:build
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.development
    interactive: true
    cmds:
      - bunx --no-install vitest --configLoader runner

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TSCONFIG: './tsconfig.vite{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    sources:
      - ./tsconfig.app.json
      - ./tsconfig.base.json
      - '{{.TSCONFIG}}'
      - ./src/**/*
      - ./vite.config.ts
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'
