version: 3

vars:
  app-build-args-template:
    map:
      required:
        - &build-required-RENDER_TARGET
          name: RENDER_TARGET
          enum: [browser, ssr]
        - &build-required-BUILD_PROFILE
          name: BUILD_PROFILE
          enum: [development, release]
        - &build-required-TARGET_ENVIRONMENT
          name: TARGET_ENVIRONMENT
          enum: [local, ci, testing, production]
        - &build-required-NODE_ENV
          name: NODE_ENV
          enum: [development, production]

tasks:
  clean:
    - rm -rf ./.cache || true
    - rm -rf ./.task || true
    - rm -rf ./dist || true

  lint:tsc:
    sources:
      - './package.json'
      - './vite.config.ts'
      - './src/**/*.ts'
      - './tsconfig/**/*.json'
      - '{{.ROOT_DIR}}/packages/shared/package.json'
      - '{{.ROOT_DIR}}/packages/shared/src/**/*.ts'
      - '{{.SOURCES.tsconfigPackage}}'
      - '{{.SOURCES.tsconfigs}}'
      - '{{.SOURCES.lockfile}}'
    cmds:
      - bunx --no-install tsc --noEmit --project ./tsconfig/tsconfig.app.json
      - bunx --no-install tsc --noEmit --project ./tsconfig/tsconfig.app.bundler.json

  build:dist-paths:
    label: '{{.TASK}}@{{.TARGET_ENVIRONMENT}}:{{.BUILD_PROFILE}}'
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-TARGET_ENVIRONMENT
    vars:
      DIST_DIR: './dist/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}'
    sources:
      - './tsconfig/**/*.json'
      - './src/dist-paths.ts'
      - '{{.SOURCES.lockfile}}'
    generates:
      - '{{.DIST_DIR}}/dist-paths.js'
    cmds:
      - >
        bunx --no-install tsc
        --project ./tsconfig/tsconfig.dist-paths.json
        --outDir {{.DIST_DIR}}

  build:
    label: &build-label >-
      {{.TASK}}@{{.TARGET_ENVIRONMENT}}:{{.BUILD_PROFILE}}:{{.RENDER_TARGET}}:{{.NODE_ENV}}
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-NODE_ENV
        - *build-required-RENDER_TARGET
        - *build-required-TARGET_ENVIRONMENT
    vars:
      NODE_ENV: &node-env >-
        {{.NODE_ENV | default (get .MAPPINGS.BUILD_PROFILE_2_NODE_ENV .BUILD_PROFILE)}}
      ENV_FILE: &env-file './.env/.env.{{.TARGET_ENVIRONMENT}}.{{.BUILD_PROFILE}}'
      DIST_DIR_BROWSER: &dist-dir-browser >-
        ./dist/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}/browser
      DIST_DIR_SSR: >-
        ./dist/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}/ssr
      RENDER_TARGET_ARGS_MAP:
        map:
          browser:
            distDir: '{{.DIST_DIR_BROWSER}}'
            viteArgs: []
          ssr:
            distDir: '{{.DIST_DIR_SSR}}'
            viteArgs:
              - --ssr
              - ./src/main.server.ts
      RENDER_TARGET_ARGS:
        ref: get .RENDER_TARGET_ARGS_MAP .RENDER_TARGET
      DIST_DIR: '{{.RENDER_TARGET_ARGS.distDir}}'
      CLI_ARGS_LIST:
        ref: concat .CLI_ARGS_LIST .RENDER_TARGET_ARGS.viteArgs
    sources: &build-sources
      - './index.html'
      - './package.json'
      - './public/**/*'
      - './src/**/*'
      - './tsconfig/**/*.json'
      - './vite.config.ts'
      - '{{.ENV_FILE}}'
      - '{{.ROOT_DIR}}/packages/shared/package.json'
      - '{{.ROOT_DIR}}/packages/shared/generated/**/*'
      - '{{.ROOT_DIR}}/packages/shared/src/**/*'
      - '{{.SOURCES.tsconfigPackage}}'
      - '{{.SOURCES.tsconfigs}}'
      - '{{.SOURCES.lockfile}}'
    generates:
      - '{{.DIST_DIR}}/**/*'
    deps:
      - task: build:dist-paths
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      - task: :shared:build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
    dotenv:
      - '{{.ENV_FILE}}'
    env:
      BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      BUILD_SOURCE_MODE: dist
      BUILD_TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      NODE_ENV: '{{.NODE_ENV}}'
    cmds:
      - >
        bunx --no-install vite build
        --outDir {{.DIST_DIR | q}}
        {{range .CLI_ARGS_LIST}}{{. | q}} {{end}}

  build:full:
    label: *build-label
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-NODE_ENV
        - *build-required-TARGET_ENVIRONMENT
    sources: *build-sources
    deps:
      - task: build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          RENDER_TARGET: browser
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      - task: build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          RENDER_TARGET: ssr
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'

  start:
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-NODE_ENV
        - *build-required-TARGET_ENVIRONMENT
    vars:
      NODE_ENV: *node-env
      DIST_DIR: *dist-dir-browser
    deps:
      - task: build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          RENDER_TARGET: browser
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
    dotenv:
      - *env-file
    env:
      BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      BUILD_SOURCE_MODE: dist
      BUILD_TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      NODE_ENV: '{{.NODE_ENV}}'
    cmds:
      - bunx --no-install vite preview --outDir {{.DIST_DIR | q}}

  start:dev:
    deps:
      - task: :shared:generate
    dotenv:
      - './.env/.env.local.development'
    env:
      BUILD_PROFILE: development
      BUILD_SOURCE_MODE: source
      BUILD_TARGET_ENVIRONMENT: local
      NODE_ENV: development
    cmds:
      - bunx --no-install vite dev --configLoader runner
