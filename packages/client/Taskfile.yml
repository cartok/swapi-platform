version: 3

tasks:
  clean:
    - rm -rf ./.cache || true
    - rm -rf ./.task || true
    - rm -rf ./dist || true

  lint:tsc:
    sources:
      - './package.json'
      - './vite.config.ts'
      - './src/**/*.ts'
      - './tsconfig/**/*.json'
      - '{{.ROOT_DIR}}/packages/shared/package.json'
      - '{{.ROOT_DIR}}/packages/shared/src/**/*.ts'
      - '{{.T_SOURCES.tsconfigPackage}}'
      - '{{.T_SOURCES.tsconfigs}}'
      - '{{.T_SOURCES.lockfile}}'
    cmds:
      - bunx --no-install tsc --noEmit --project ./tsconfig/tsconfig.vite.json

  build:
    label: '{{.TASK}}:{{.T_TARGET_ENVIRONMENT}}:{{.T_BUILD_LEVEL}}'
    requires:
      vars:
        - name: T_BUILD_LEVEL
          enum: [development, release]
        - name: T_TARGET_ENVIRONMENT
          enum: [local, testing, production]
    vars:
      T_BUILD_LEVEL:
        ref: coalesce (env "SWAPI_BUILD_LEVEL") .T_BUILD_LEVEL "release"
      T_TARGET_ENVIRONMENT:
        ref: coalesce (env "SWAPI_TARGET_ENVIRONMENT") .T_TARGET_ENVIRONMENT "local"
      T_ENV_FILE: './.env/.env.{{.T_TARGET_ENVIRONMENT}}.{{.T_BUILD_LEVEL}}'
    sources: &app-sources
      - './index.html'
      - './package.json'
      - './vite.config.ts'
      - '{{.T_ENV_FILE}}'
      - './public/**/*'
      - './src/**/*'
      - './tsconfig/**/*.json'
      - '{{.T_SOURCES.lockfile}}'
    deps:
      - task: build:browser
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
          T_TARGET_ENVIRONMENT:
            ref: .T_TARGET_ENVIRONMENT
      - task: build:ssr
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
          T_TARGET_ENVIRONMENT:
            ref: .T_TARGET_ENVIRONMENT

  build:dist-paths:
    label: '{{.TASK}}:{{.T_TARGET_ENVIRONMENT}}:{{.T_BUILD_LEVEL}}'
    requires:
      vars:
        - name: T_BUILD_LEVEL
          enum: [development, release]
        - name: T_TARGET_ENVIRONMENT
          enum: [local, testing, production]
    vars:
      T_BUILD_LEVEL:
        ref: coalesce (env "SWAPI_BUILD_LEVEL") .T_BUILD_LEVEL "release"
      T_TARGET_ENVIRONMENT:
        ref: coalesce (env "SWAPI_TARGET_ENVIRONMENT") .T_TARGET_ENVIRONMENT "local"
      T_DIST_ROOT: './dist/{{.T_TARGET_ENVIRONMENT}}/{{.T_BUILD_LEVEL}}'
      T_DIST_DIR: '{{.T_DIST_ROOT}}'
    sources:
      - './tsconfig/**/*.json'
      - './src/dist-paths.ts'
      - '{{.T_SOURCES.lockfile}}'
    generates:
      - '{{.T_DIST_DIR}}/dist-paths.js'
    cmds:
      - >
        bunx --no-install tsc
        --project ./tsconfig/tsconfig.dist-paths.json
        --outDir {{.T_DIST_DIR}}

  build:browser:
    label: '{{.TASK}}:{{.T_TARGET_ENVIRONMENT}}:{{.T_BUILD_LEVEL}}'
    requires:
      vars:
        - name: T_BUILD_LEVEL
          enum: [development, release]
        - name: T_TARGET_ENVIRONMENT
          enum: [local, testing, production]
    vars:
      T_BUILD_LEVEL:
        ref: coalesce (env "SWAPI_BUILD_LEVEL") .T_BUILD_LEVEL "release"
      T_TARGET_ENVIRONMENT:
        ref: coalesce (env "SWAPI_TARGET_ENVIRONMENT") .T_TARGET_ENVIRONMENT "local"
      T_ENV_FILE: './.env/.env.{{.T_TARGET_ENVIRONMENT}}.{{.T_BUILD_LEVEL}}'
      T_DIST_ROOT: './dist/{{.T_TARGET_ENVIRONMENT}}/{{.T_BUILD_LEVEL}}'
      T_DIST_DIR: '{{.T_DIST_ROOT}}/browser'
    dotenv:
      - '{{.T_ENV_FILE}}'
    env:
      SWAPI_SOURCE_MODE: dist
      SWAPI_TARGET_ENVIRONMENT:
        ref: .T_TARGET_ENVIRONMENT
      SWAPI_BUILD_LEVEL:
        ref: .T_BUILD_LEVEL
    sources: *app-sources
    generates:
      - '{{.T_DIST_DIR}}/**/*'
    deps:
      - task: build:dist-paths
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
          T_TARGET_ENVIRONMENT:
            ref: .T_TARGET_ENVIRONMENT
      - task: :shared:build
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
    cmds:
      - >
        bunx --no-install vite build
        --outDir {{.T_DIST_DIR}}

  build:ssr:
    label: '{{.TASK}}:{{.T_TARGET_ENVIRONMENT}}:{{.T_BUILD_LEVEL}}'
    requires:
      vars:
        - name: T_BUILD_LEVEL
          enum: [development, release]
        - name: T_TARGET_ENVIRONMENT
          enum: [local, testing, production]
    vars:
      T_BUILD_LEVEL:
        ref: coalesce (env "SWAPI_BUILD_LEVEL") .T_BUILD_LEVEL "release"
      T_TARGET_ENVIRONMENT:
        ref: coalesce (env "SWAPI_TARGET_ENVIRONMENT") .T_TARGET_ENVIRONMENT "local"
      T_ENV_FILE: './.env/.env.{{.T_TARGET_ENVIRONMENT}}.{{.T_BUILD_LEVEL}}'
      T_DIST_ROOT: './dist/{{.T_TARGET_ENVIRONMENT}}/{{.T_BUILD_LEVEL}}'
      T_DIST_DIR: '{{.T_DIST_ROOT}}/ssr'
    dotenv:
      - '{{.T_ENV_FILE}}'
    env:
      SWAPI_SOURCE_MODE: dist
      SWAPI_TARGET_ENVIRONMENT:
        ref: .T_TARGET_ENVIRONMENT
      SWAPI_BUILD_LEVEL:
        ref: .T_BUILD_LEVEL
    sources: *app-sources
    generates:
      - '{{.T_DIST_DIR}}/**/*'
    deps:
      - task: build:dist-paths
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
          T_TARGET_ENVIRONMENT:
            ref: .T_TARGET_ENVIRONMENT
      - task: :shared:build
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
    cmds:
      - >
        bunx --no-install vite build
        --ssr ./src/main.server.ts
        --outDir {{.T_DIST_DIR}}

  start:dev:
    dotenv:
      - './.env/.env.local.development'
    env:
      SWAPI_SOURCE_MODE: source
      SWAPI_TARGET_ENVIRONMENT: local
      SWAPI_BUILD_LEVEL: development
    deps:
      - task: :shared:generate
    cmds:
      - bunx --no-install vite dev --configLoader runner

  start:
    label: '{{.TASK}}:{{.T_TARGET_ENVIRONMENT}}:{{.T_BUILD_LEVEL}}'
    requires:
      vars:
        - name: T_BUILD_LEVEL
          enum: [development, release]
        - name: T_TARGET_ENVIRONMENT
          enum: [local, testing, production]
    vars:
      T_BUILD_LEVEL:
        ref: coalesce (env "SWAPI_BUILD_LEVEL") .T_BUILD_LEVEL "release"
      T_TARGET_ENVIRONMENT:
        ref: coalesce (env "SWAPI_TARGET_ENVIRONMENT") .T_TARGET_ENVIRONMENT "local"
      T_ENV_FILE: './.env/.env.{{.T_TARGET_ENVIRONMENT}}.{{.T_BUILD_LEVEL}}'
      T_DIST_ROOT: './dist/{{.T_TARGET_ENVIRONMENT}}/{{.T_BUILD_LEVEL}}'
      T_DIST_DIR: '{{.T_DIST_ROOT}}/browser'
    dotenv:
      - '{{.T_ENV_FILE}}'
    env:
      SWAPI_SOURCE_MODE: dist
      SWAPI_TARGET_ENVIRONMENT:
        ref: .T_TARGET_ENVIRONMENT
      SWAPI_BUILD_LEVEL:
        ref: .T_BUILD_LEVEL
    deps:
      - task: build:browser
        vars:
          T_BUILD_LEVEL:
            ref: .T_BUILD_LEVEL
          T_TARGET_ENVIRONMENT:
            ref: .T_TARGET_ENVIRONMENT
    cmds:
      - bunx --no-install vite preview --outDir {{.T_DIST_DIR}}

  test:
    dotenv:
      - './.env/.env.local.development'
    env:
      SWAPI_SOURCE_MODE: source
      SWAPI_TARGET_ENVIRONMENT: local
      SWAPI_BUILD_LEVEL: development
    deps:
      - task: :shared:build
        vars:
          T_BUILD_LEVEL: development
    cmds:
      - bunx --no-install vitest --configLoader runner run

  test:watch:
    interactive: true
    dotenv:
      - './.env/.env.local.development'
    env:
      SWAPI_SOURCE_MODE: source
      SWAPI_TARGET_ENVIRONMENT: local
      SWAPI_BUILD_LEVEL: development
    deps:
      - task: :shared:build
        vars:
          T_BUILD_LEVEL: development
    cmds:
      - bunx --no-install vitest --configLoader runner
