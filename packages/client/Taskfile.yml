version: 3

includes:
  shared:
    taskfile: ../shared
    dir: ../shared
    internal: true

tasks:
  clean:
    - rm -rf ./dist || true

  dev:
    deps:
      - task: shared:generate
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default "development"
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install vite --configLoader runner

  build:
    deps:
      - task: build:browser
      - task: build:ssr

  build:browser:watch:
    cmds:
      - task: build:browser
        vars:
          WATCH: true

  build:browser:
    deps:
      - task: shared:build
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default "production"
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./src/**/*
    generates:
      - ./dist/browser/**/*
    cmds:
      - >
        bunx --no-install vite build
        --outDir ./dist/browser
        {{if .WATCH}}--watch{{end}}

  build:ssr:watch:
    cmds:
      - task: build:ssr
        vars:
          WATCH: true

  build:ssr:
    deps:
      - task: shared:build
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default "production"
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./src/**/*
    generates:
      - ./dist/ssr/**/*
    cmds:
      - >
        bunx --no-install vite build
        --ssr ./src/main.server.ts
        --outDir ./dist/ssr
        {{if .WATCH}}--watch{{end}}

  start:
    deps:
      - task: build:browser
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default "production"
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install vite preview --outDir ./dist/browser

  test:watch:
    cmds:
      - task: shared:build
        vars:
          WATCH: true

  test:
    deps:
      - task: shared:build
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.development
    cmds:
      - bunx --no-install vitest --configLoader runner {{if eq .WATCH false}}run{{end}}
