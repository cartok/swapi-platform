version: 3

tasks:
  clean:
    - rm -rf ./.cache || true
    - rm -rf ./.task || true
    - rm -rf ./dist || true

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TSCONFIG: './tsconfig/tsconfig.vite{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    sources:
      - ./package.json
      - ./vite.config.ts
      - ./tsconfig/tsconfig.app.json
      - ./tsconfig/tsconfig.base.json
      - '{{.TSCONFIG}}'
      - ./src/**/*
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'

  dev:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: :shared:generate
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install vite --configLoader runner

  build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: build:browser
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
      - task: build:ssr
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'

  build:browser:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TSCONFIG: './tsconfig/tsconfig.vite{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: :shared:build
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./package.json
      - ./vite.config.ts
      - ./env/.env.output.{{.MODE}}
      - ./env/.env.target.{{.TARGET}}
      - ./tsconfig/tsconfig.app.json
      - ./tsconfig/tsconfig.base.json
      - '{{.TSCONFIG}}'
      - ./{src,public}/**/*
    generates:
      - ./dist/browser/**/*
    cmds:
      - >
        bunx --no-install vite build
        --outDir ./dist/browser
      - touch ./dist/browser/.build-mode-{{.MODE}}

  build:ssr:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TSCONFIG: './tsconfig/tsconfig.vite{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: :shared:build
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./package.json
      - ./vite.config.ts
      - ./env/.env.output.{{.MODE}}
      - ./env/.env.target.{{.TARGET}}
      - ./tsconfig/tsconfig.app.json
      - ./tsconfig/tsconfig.base.json
      - '{{.TSCONFIG}}'
      - ./{src,public}/**/*
    generates:
      - ./dist/ssr/**/*
    cmds:
      - >
        bunx --no-install vite build
        --ssr ./src/main.server.ts
        --outDir ./dist/ssr
      - touch ./dist/ssr/.build-mode-{{.MODE}}

  start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: build:browser
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install vite preview --outDir ./dist/browser

  test:
    deps:
      - task: :shared:build
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.development
    cmds:
      - bunx --no-install vitest --configLoader runner run

  test:watch:
    deps:
      - task: :shared:build
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.development
    interactive: true
    cmds:
      - bunx --no-install vitest --configLoader runner
