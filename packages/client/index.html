<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Angular Signals-based SWAPI Frontend</title>
    <base href="%BASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="preload"
      href="/src/assets/fonts/Roboto-VariableFont_wdth,wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      @font-face {
        font-family: 'Roboto';
        src: url('/src/assets/fonts/Roboto-VariableFont_wdth,wght.woff2') format('woff2');
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
      }
    </style>

    <link
      rel="icon"
      sizes="96x96"
      type="image/png"
      href="/src/assets/favicons/favicon-96x96.png?no-inline"
    />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="/src/assets/favicons/apple-touch-icon.png?no-inline"
    />
    <link
      rel="icon"
      sizes="any"
      type="image/svg+xml"
      href="/src/assets/favicons/favicon.svg?no-inline"
    />

    <link
      rel="preload"
      href="/src/assets/svg/sprite-sheet.svg?no-inline"
      as="image"
      type="image/svg+xml"
    />
  </head>
  <body>
    <img
      src="/src/assets/svg/sprite-sheet.svg?no-inline"
      style="display: none"
      aria-hidden="true"
    />
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
