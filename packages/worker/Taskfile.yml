version: 3

tasks:
  clean:
    cmds:
      - rm -f ./tsconfig/*.tsbuildinfo || true
      - rm -rf ./.wrangler || true
      - rm -rf ./dist || true

  lint:
    deps:
      - task: typegen
    sources:
      - ./src/**/*
      - ./tsconfig/tsconfig.worker.json
      - ../../bun.lock
    cmds:
      - bunx --no-install tsc --noEmit --project ./tsconfig/tsconfig.worker.json

  typegen:
    cmds:
      - cmd: >
          bunx --no-install wrangler types
          --env-interface CloudflareBindings
        if: >
          !
          bunx --no-install wrangler types
          --env-interface CloudflareBindings
          --check

  deps:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    deps:
      - task: typegen
      - task: :shared:build
        vars:
          PROFILE: '{{.PROFILE}}'

  dev:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    desc: 'Start `server:dev` separately'
    deps:
      - task: deps
        vars:
          PROFILE: '{{.PROFILE}}'
    cmds:
      - bunx --no-install wrangler dev --port 52000

  build:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
      CF_TARGET:
        ref: .CF_TARGET | default "testing"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: CF_TARGET
          enum: [testing, production]
    deps:
      - task: deps
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: lint
    sources:
      - ./package.json
      - ./worker-configuration.d.ts
      - ./wrangler.jsonc
      - ./src/**/*
      - ./tsconfig/**/*
      - ../shared/dist/release/**/*
      - ../../bun.lock
    generates:
      - ./dist/**/*
    cmds:
      - rm -rf ./dist || true
      - >
        bunx --no-install wrangler deploy
        --env {{.CF_TARGET}}
        --outdir ./dist
        --metafile ./dist/bundle-meta.json
        --dry-run

  start:
    desc: 'Start `server:dev` separately'
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
      CF_TARGET:
        ref: .CF_TARGET | default "testing"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: CF_TARGET
          enum: [testing, production]
    deps:
      - task: build
        vars:
          PROFILE: '{{.PROFILE}}'
          CF_TARGET: '{{.CF_TARGET}}'
    cmds:
      - >
        bunx --no-install wrangler dev
        --env {{.CF_TARGET}}
        --no-bundle
        --port 53000
        ./dist/index.js

  deploy:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
      CF_TARGET:
        ref: .CF_TARGET | default "production"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
        - name: CF_TARGET
          enum: [testing, production]
    deps:
      - task: build
        vars:
          PROFILE: '{{.PROFILE}}'
          CF_TARGET: 'production'
    cmds:
      - bunx --no-install wrangler deploy --env {{.CF_TARGET}} --minify
      - bunx --no-install wrangler deployments list --env {{.CF_TARGET}}
