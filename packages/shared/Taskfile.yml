version: 3

tasks:
  clean:
    cmds:
      - rm -f ./tsconfig/*.tsbuildinfo || true
      - rm -rf ./.cache || true
      - rm -rf ./.task || true
      - rm -rf ./dist || true
      - rm -rf ./generated || true

  lint:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    deps:
      - task: lint:generators
        vars:
          PROFILE: '{{.PROFILE}}'
      - task: lint:src
        vars:
          PROFILE: '{{.PROFILE}}'

  lint:generators:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
      TSCONFIG: './tsconfig/tsconfig.generators{{if eq .PROFILE "release"}}.release{{end}}.json'
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    sources:
      - '{{.TSCONFIG}}'
      - ./{generators,src}/**/*
      - ../../bun.lock
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'

  lint:src:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
      TSCONFIG: './tsconfig/tsconfig.src{{if eq .PROFILE "release"}}.release{{end}}.json'
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    sources:
      - ./package.json
      - '{{.TSCONFIG}}'
      - ./src/**/*
      - ../../bun.lock
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'

  build:
    vars:
      PROFILE:
        ref: .PROFILE | default "debug"
      DIST_DIR: './dist/{{.PROFILE}}'
      TSCONFIG: './tsconfig/tsconfig.src{{if eq .PROFILE "release"}}.release{{end}}.json'
    requires:
      vars:
        - name: PROFILE
          enum: [debug, release]
    deps:
      - task: generate
    sources:
      - ./package.json
      - '{{.TSCONFIG}}'
      - ./src/**/*
      - ../../bun.lock
    generates:
      - '{{.DIST_DIR}}/**/*'
    cmds:
      - bunx --no-install tsc --project '{{.TSCONFIG}}' --outDir '{{.DIST_DIR}}'

  generate:
    deps:
      - task: generate:device-cookie:types
      - task: generate:device-cookie:validator
      - task: generate:custom-media-tokens

  generate:device-cookie:types:
    sources:
      - ./generators/device-cookie.schema.json
      - ../../bun.lock
    generates:
      - ./generated/types/device-cookie.types.d.ts
    cmds:
      - mkdir -p ./generated/types || true
      - >
        bunx --no-install quicktype
        --src ./generators/device-cookie.schema.json
        --src-lang schema
        --lang typescript
        --nice-property-names
        --readonly
        --top-level DeviceCookie
        --just-types
        --out ./generated/types/device-cookie.types.d.ts

  generate:device-cookie:validator:
    sources:
      - ./generators/device-cookie.schema.json
      - ./generators/device-cookie.validator.*
      - ../../bun.lock
    generates:
      - ./generated/validators/device-cookie.*
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/shared/source
        ./generators/device-cookie.validator.generator.ts

  generate:custom-media-tokens:
    sources:
      - ./generators/custom-media-tokens.*
      - ./src/device/device.ts
      - ../../bun.lock
    generates:
      - ./generated/css/media.css
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/shared/source
        ./generators/custom-media-tokens.generator.ts
