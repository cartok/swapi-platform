version: 3

vars:
  APP_SERVER_SERVICE_NAME: app-server
  APP_SERVER_COMPOSE_ENV_FILE: '{{.TASK_DIR}}/.env/.env.compose'
  APP_SERVER_DOCKER_CONTAINER_NAME: >-
    {{
      list
      .DOCKER_REPOSITORY
      .APP_SERVER_SERVICE_NAME
      | join "-"
    }}
  APP_SERVER_DOCKER_IMAGE_NAME: >-
    {{
      list
      .DOCKER_IMAGE_BASE_NAME
      .APP_SERVER_SERVICE_NAME
      | join "/"
    }}
  APP_SERVER_DOCKER_IMAGE_REFERENCE_LOCAL: >-
    {{
      list
      .APP_SERVER_DOCKER_IMAGE_NAME
      .DOCKER_IMAGE_TAG_LOCAL
      | join ":"
    }}

  server-build-args-template:
    map:
      required:
        - &build-required-BUILD_PROFILE
          name: BUILD_PROFILE
          enum: [development, release]
        - &build-required-TARGET_ENVIRONMENT
          name: TARGET_ENVIRONMENT
          enum: [local, ci, testing, production]
        - &build-required-NODE_ENV
          name: NODE_ENV
          enum: [development, production]
        - &build-required-GIT_COMMIT_SHA
          name: GIT_COMMIT_SHA

tasks:
  clean:
    cmds:
      - rm -f ./tsconfig/*.tsbuildinfo || true
      - rm -rf ./.cache || true
      - rm -rf ./.task || true
      - rm -rf ./dist || true

  lint:tsc:
    sources:
      - './package.json'
      - './src/**/*.ts'
      - './tsconfig/**/*.json'
      - '{{.ROOT_DIR}}/packages/client/package.json'
      - '{{.ROOT_DIR}}/packages/client/src/dist-paths.ts'
      - '{{.ROOT_DIR}}/packages/client/src/main.server.d.ts'
      - '{{.ROOT_DIR}}/packages/shared/package.json'
      - '{{.ROOT_DIR}}/packages/shared/src/**/*.ts'
      - '{{.ROOT_DIR}}/packages/hono/package.json'
      - '{{.ROOT_DIR}}/packages/hono/src/**/*.ts'
      - '{{.SOURCES.tsconfigPackage}}'
      - '{{.SOURCES.tsconfigs}}'
      - '{{.SOURCES.lockfile}}'
    deps:
      - task: :shared:generate
    cmds:
      - bunx --no-install tsc --noEmit --project ./tsconfig/tsconfig.server.json
      - bunx --no-install tsc --noEmit --project ./tsconfig/tsconfig.server.bundler.json

  watch:
    internal: true
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - TASK
    preconditions:
      - command -v watchexec
    dir: '{{.ROOT_DIR}}'
    cmds:
      - >
        watchexec --restart --quiet
        --watch {{.SOURCES.lockfile}}
        --watch ./packages/client/index.html
        --watch ./packages/client/public
        --watch ./packages/client/src
        --watch ./packages/client/vite.config.ts
        --watch ./packages/hono/src
        --watch ./packages/server/rolldown.config.ts
        --watch ./packages/server/src
        --watch ./packages/shared/generated
        --watch ./packages/shared/src
        --watch ./packages/tsconfig
        {{range .WATCHEXEC_ARGS}}{{. | q}}{{end}}
        -- task {{.TASK}}
        BUILD_PROFILE={{.BUILD_PROFILE}}
        TARGET_ENVIRONMENT=local
        {{.CLI_ARGS}}

  build:compile:
    label: '{{.TASK}}@{{.TARGET_ENVIRONMENT}}:{{.BUILD_PROFILE}}'
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-TARGET_ENVIRONMENT
    vars:
      TSCONFIGS:
        map:
          development: ./tsconfig/tsconfig.server.json
          release: ./tsconfig/tsconfig.server.release.json
      TSCONFIG: '{{get .TSCONFIGS .BUILD_PROFILE}}'
      DIST_DIR: &dist-dir-build './dist/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}/build'
    sources:
      - './.env/.env.{{.TARGET_ENVIRONMENT}}.{{.BUILD_PROFILE}}'
      - './package.json'
      - './src/**/*'
      - './tsconfig/**/*.json'
      - '{{.SOURCES.lockfile}}'
    generates:
      - '{{.DIST_DIR}}/**/*'
    deps:
      - task: :shared:build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      - task: :hono:build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
    cmds:
      - >
        bunx --no-install tsc
        --project {{.TSCONFIG | q}}
        --outDir {{.DIST_DIR | q}}

  build:
    label: '{{.TASK}}@{{.TARGET_ENVIRONMENT}}:{{.BUILD_PROFILE}}:{{.NODE_ENV}}'
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-NODE_ENV
        - *build-required-TARGET_ENVIRONMENT
    deps:
      - task: build:compile
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      - task: :client:build:full
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'

  build:dev:
    cmds:
      - task: build
        vars:
          BUILD_PROFILE: development
          NODE_ENV: development
          TARGET_ENVIRONMENT: local

  run:ssg:dev:
    interactive: true
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-TARGET_ENVIRONMENT
    vars:
      ENV_FILE: &env-file './.env/.env.{{.TARGET_ENVIRONMENT}}.{{.BUILD_PROFILE}}'
    dotenv:
      - '{{.ROOT_DIR}}/.env.fly.secret'
      - '{{.ENV_FILE}}'
    cmds:
      - >
        curl "${RUN_HOST_INTERNAL}:${RUN_PORT}/ssg"
        --request POST
        --header "Authorization: Bearer ${SECRET_SSG_RENDER_TOKEN}"
        --head

  build:bundle:
    label: '{{.TASK}}@{{.TARGET_ENVIRONMENT}}:{{.BUILD_PROFILE}}:{{.NODE_ENV}}:{{.GIT_COMMIT_SHA}}'
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-GIT_COMMIT_SHA
        - *build-required-NODE_ENV
        - *build-required-TARGET_ENVIRONMENT
    vars:
      BUILD_DIST_DIR: *dist-dir-build
      DIST_DIR: &dist-dir-bundle './dist/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}/bundle'
      ENV_FILE: *env-file
      GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      NODE_ENV: &node-env >-
        {{.NODE_ENV | default (get .MAPPINGS.BUILD_PROFILE_2_NODE_ENV .BUILD_PROFILE)}}
    sources:
      - '{{.ENV_FILE}}'
      - './rolldown.config.ts'
      - './tsconfig/**/*.json'
      - '{{.BUILD_DIST_DIR}}/**/*'
      - '{{.ROOT_DIR}}/packages/client/dist/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}/**/*'
      - '{{.ROOT_DIR}}/packages/client/src/**/*'
      - '{{.ROOT_DIR}}/packages/hono/src/**/*'
      - '{{.ROOT_DIR}}/packages/shared/generated/**/*'
      - '{{.ROOT_DIR}}/packages/shared/src/**/*'
      - '{{.SOURCES.lockfile}}'
    generates:
      - '{{.DIST_DIR}}'
    deps:
      - task: build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
    dotenv:
      - '{{.ENV_FILE}}'
    env:
      BUILD_GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      BUILD_TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      NODE_ENV: '{{.NODE_ENV}}'
    cmds:
      - >
        bunx --no-install bun
        --conditions '@swapi/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}'
        --conditions '@swapi/{{.BUILD_PROFILE}}'
        "$(bunx --no-install bun pm bin)/rolldown"
        --config

  build:bundle:dev:
    cmds:
      - task: build:bundle
        vars:
          BUILD_PROFILE: development
          NODE_ENV: development
          TARGET_ENVIRONMENT: local

  build:docker:config:
    interactive: true
    silent: true
    requires:
      vars:
        - name: BUILD_PROFILE
          enum: [release, development]
        - name: TARGET_ENVIRONMENT
          enum: [local, ci, testing, production]
        - name: DOCKER_TARGET
          enum: [runtime, base, deps, code, bundle]
        - name: DEV_MODE
          enum: ['false', 'true']
    vars:
      NODE_ENV: *node-env
      DOCKER_IMAGE_TAG: >-
        {{
          list
          .GIT_COMMIT_SHA_SHORT
          .DOCKER_TARGET
          .BUILD_PROFILE
          .TARGET_ENVIRONMENT
          | compact | join "-"
        }}
      DOCKER_IMAGE_REFERENCE_DEFAULT: >-
        {{
          list
          .APP_SERVER_DOCKER_IMAGE_NAME
          .DOCKER_IMAGE_TAG
          | compact | join ":"
        }}
      DOCKER_IMAGE_REFERENCE: >-
        {{
          eq .TARGET_ENVIRONMENT "local" | ternary
            .APP_SERVER_DOCKER_IMAGE_REFERENCE_LOCAL
            .DOCKER_IMAGE_REFERENCE_DEFAULT
        }}
      PORT:
        sh: >-
          bunx --no-install dotenvx get RUN_PORT -f
          {{.TASK_DIR}}/.env/.env.{{.TARGET_ENVIRONMENT}}.{{.BUILD_PROFILE}}
    cmds:
      - |
        cat <<- EOF > {{.APP_SERVER_COMPOSE_ENV_FILE}}
        # This file was genereated by \`task build:docker:config\`.
        # Either change values manually or use the task to reconfigure it.
        APP_SERVER_CONTAINER_NAME={{.APP_SERVER_DOCKER_CONTAINER_NAME}}
        APP_SERVER_DOCKER_IMAGE_REFERENCE={{.DOCKER_IMAGE_REFERENCE}}
        APP_SERVER_DOCKER_IMAGE_VARIANT={{eq .DEV_MODE "true" | ternary "slim" "distroless"}}
        APP_SERVER_DOCKER_TARGET={{.DOCKER_TARGET}}
        APP_SERVER_PORT={{.PORT}}
        APP_TARGET_ENVIRONMENT={{.TARGET_ENVIRONMENT}}
        GIT_COMMIT_SHA={{.GIT_COMMIT_SHA}}
        NODE_ENV={{.NODE_ENV}}
        BUILD_PROFILE={{.BUILD_PROFILE}}
        EOF
      - |
        echo ""
        echo "Generated env file"
        bat --no-paging --style=auto --language=env {{.APP_SERVER_COMPOSE_ENV_FILE}}
      - cmd: |
          if gum spin --title "Checking compose config..." -- docker compose \
            --env-file {{.APP_SERVER_COMPOSE_ENV_FILE}} \
            build --quiet --check app-server
          then
            echo "Config seems valid. Be sure to check for warnings though."
          else
            rm -f {{.APP_SERVER_COMPOSE_ENV_FILE}}
            echo "Config is invalid. Removed {{.APP_SERVER_COMPOSE_ENV_FILE}}."
            exit 1
          fi
      - |
        echo ""
        echo "Compose config is:"
        docker compose --env-file {{.APP_SERVER_COMPOSE_ENV_FILE}} config 2> /dev/null \
          | bat --no-paging --style=auto --language=yml --file-name="Compiled compose file"

  build:docker:config:if-none-exists:
    summary: |-
      Running sub tasks via shell, like done here, if the config does not exist
      is not a good pattern. Do better not repeat that. There are too many restrictions
      and consequences running a task like this.

      Problem is that at this moment Taskfile's interactive mode is not forwarding
      the enum selection of required variables to parent processes.

      Additionally: When you set `requires`, it passes status checks.
      So doing it like this is the only best solution I see right now.
    interactive: true
    silent: true
    preconditions:
      - '[ "${CI:-}" != "true" ]'
    cmds:
      - cmd: |
          # Task has to run from root dir, otherwise the global variables are not available.
          cd {{.ROOT_DIR}}
          bunx --no-install task server:build:docker:config
        if: |
          ! test -s {{.APP_SERVER_COMPOSE_ENV_FILE}}
          ! test -r {{.APP_SERVER_COMPOSE_ENV_FILE}}

  build:docker:
    interactive: true
    silent: true
    cmds:
      - task: build:docker:config:if-none-exists
        if: '[ "${CI:-}" != "true" ]'
      - cmd: |
          echo ""
          if gum confirm "Build?"; then
            docker compose --env-file {{.APP_SERVER_COMPOSE_ENV_FILE}} build app-server
          fi
        if: '[ "${CI:-}" != "true" ]'
      - cmd: >-
          docker compose --env-file {{.APP_SERVER_COMPOSE_ENV_FILE}} build app-server
        if: '[ "${CI:-}" = "true" ]'

  start:
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-NODE_ENV
        - *build-required-TARGET_ENVIRONMENT
    vars:
      DIST_DIR: *dist-dir-build
      ENV_FILE: *env-file
      GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      NODE_ENV: *node-env
    deps:
      - task: build
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
    dotenv:
      - '{{.ENV_FILE}}'
    env:
      BUILD_GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      BUILD_TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      NODE_ENV: '{{.NODE_ENV}}'
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}
        --conditions @swapi/{{.BUILD_PROFILE}}
        {{.DIST_DIR}}/server.jit.js

  start:watch:
    cmds:
      - task: watch
        vars:
          BUILD_PROFILE: development
          TASK: start
          WATCHEXEC_ARGS: [--debounce="2s"]

  start:dev:
    summary: |-
      The app code will get statically built and used in the server builds. This can be
      improved later, to have everything come directly from source, living in RAM and
      with direct hot reload.

      Use `start:dev:watch` instead, if you want to work on app and app-server
      simultaneously. It rebuilds on client changes debounced.

      Have to see how it goes with the docker workflow. It might make this obsolete.
    vars:
      BUILD_PROFILE: development
      GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      NODE_ENV: development
      TARGET_ENVIRONMENT: local
    deps:
      - task: :client:build:full
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          NODE_ENV: '{{.NODE_ENV}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
    dotenv:
      - './.env/.env.local.{{.BUILD_PROFILE}}'
    env:
      BUILD_GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      BUILD_TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      NODE_ENV: '{{.NODE_ENV}}'
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/server/source
        --conditions @swapi/shared/source
        --conditions @swapi/local/{{.BUILD_PROFILE}}
        --hot
        ./src/server.jit.ts

  start:dev:watch:
    cmds:
      - task: watch
        vars:
          BUILD_PROFILE: development
          TASK: start:dev
          WATCHEXEC_ARGS: [--debounce="2s"]

  start:bundle:
    requires:
      vars:
        - *build-required-BUILD_PROFILE
        - *build-required-NODE_ENV
        - *build-required-TARGET_ENVIRONMENT
    vars:
      DIST_DIR: *dist-dir-bundle
      ENV_FILE: *env-file
      GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      NODE_ENV: *node-env
    deps:
      - task: build:bundle
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
          NODE_ENV: '{{.NODE_ENV}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
    dotenv:
      - '{{.ENV_FILE}}'
    env:
      BUILD_GIT_COMMIT_SHA: '{{.GIT_COMMIT_SHA}}'
      BUILD_PROFILE: '{{.BUILD_PROFILE}}'
      BUILD_TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
      NODE_ENV: '{{.NODE_ENV}}'
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/{{.TARGET_ENVIRONMENT}}/{{.BUILD_PROFILE}}
        --conditions @swapi/{{.BUILD_PROFILE}}
        --expose-gc
        {{.DIST_DIR}}/server.js

  start:bundle:dev:
    cmds:
      - task: start:bundle
        vars:
          BUILD_PROFILE: development
          TARGET_ENVIRONMENT: local
          NODE_ENV: development

  start:bundle:dev:watch:
    cmds:
      - task: watch
        vars:
          BUILD_PROFILE: release
          TASK: start:bundle:dev
          WATCHEXEC_ARGS: [--debounce="3s"]

  start:docker:
    cmds:
      - docker compose --env-file {{.APP_SERVER_COMPOSE_ENV_FILE}} up app-server -d

  start:docker:dev:
    interactive: true
    silent: true
    cmds:
      - docker rm --force {{.APP_SERVER_DOCKER_CONTAINER_NAME}} >/dev/null 2>&1 || true
      - >
        docker compose
        --file {{.ROOT_DIR}}/compose.dev.yml
        --env-file {{.APP_SERVER_COMPOSE_ENV_FILE}}
        up app-server
        --remove-orphans
