version: 3

tasks:
  clean:
    cmds:
      - rm -f ./tsconfig/*.tsbuildinfo || true
      - rm -rf ./.cache || true
      - rm -rf ./.task || true
      - rm -rf ./dist || true

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TSCONFIG: './tsconfig/tsconfig.server.lint{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: :shared:generate
    sources:
      - '{{.TSCONFIG}}'
      - ./src/**/*
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'

  dev:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TARGET_AND_MODE_CONDITION: '@swapi/{{.TARGET}}/{{.MODE}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: :client:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    interactive: true
    cmds:
      - cmd: >
          SWAPI_SERVER_PORT={{if eq .MODE "development"}}50000{{else}}51000{{end}}
          bunx --no-install bun
          --conditions @swapi/source
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          --watch ./src/server.ts
        if: '{{eq .TARGET "local"}}'
      - cmd: >
          bunx --no-install bun
          --conditions @swapi/source
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          --watch ./src/server.ts
        if: '{{ne .TARGET "local"}}'

  build:with-ssg:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_DIST_DIR: './dist/{{.TARGET}}/{{.MODE}}/build'
      CLIENT_DIST_ROOT: '../client/dist/{{.TARGET}}/{{.MODE}}'
      CLIENT_SSG_DIST_DIR: '{{.CLIENT_DIST_ROOT}}/ssg'
      CLIENT_SSR_ENTRY: '{{.CLIENT_DIST_ROOT}}/ssr/main.server.js'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.TARGET}}/{{.MODE}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    sources:
      - '{{.TSCONFIG}}'
      - ./package.json
      - ./.env/.env.base
      - ./.env/.env.output.{{.MODE}}
      - ./.env/.env.target.{{.TARGET}}
      - '{{.BUILD_DIST_DIR}}/prerender.js'
      - '{{.CLIENT_SSR_ENTRY}}'
    generates:
      - '{{.CLIENT_SSG_DIST_DIR}}/index.html'
      - '{{.CLIENT_SSG_DIST_DIR}}/**/*/index.html'
    cmds:
      - cmd: >
          SWAPI_SERVER_PORT={{if eq .MODE "development"}}50000{{else}}51000{{end}}
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          {{.BUILD_DIST_DIR}}/prerender.js
        if: '{{eq .TARGET "local"}}'
      - cmd: >
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          {{.BUILD_DIST_DIR}}/prerender.js
        if: '{{ne .TARGET "local"}}'

  build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build:compile
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
      - task: :client:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}

  build:compile:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_DIST_DIR: './dist/{{.TARGET}}/{{.MODE}}/build'
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: :shared:build
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    sources:
      - '{{.TSCONFIG}}'
      - ./package.json
      - ./.env/.env.base
      - ./.env/.env.output.{{.MODE}}
      - ./.env/.env.target.{{.TARGET}}
      - ./src/**/*
    generates:
      - '{{.BUILD_DIST_DIR}}/**/*'
    cmds:
      - >
        bunx --no-install tsc
        --project '{{.TSCONFIG}}'
        --outDir '{{.BUILD_DIST_DIR}}'

  bundle:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      DIST_ROOT: './dist/{{.TARGET}}/{{.MODE}}'
      BUILD_DIST_DIR: '{{.DIST_ROOT}}/build'
      BUNDLE_DIST_DIR: '{{.DIST_ROOT}}/bundle'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.TARGET}}/{{.MODE}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build:with-ssg
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    sources:
      - ./tsconfig/tsconfig.server.bundle.json
      - ./rolldown.config.ts
      - '{{.BUILD_DIST_DIR}}/**/*'
    generates:
      - '{{.BUNDLE_DIST_DIR}}/**/*'
    cmds:
      - cmd: >
          SWAPI_SERVER_PORT={{if eq .MODE "development"}}50000{{else}}51000{{end}}
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          "$(bunx --no-install bun pm bin)/rolldown"
          --dir {{.BUNDLE_DIST_DIR}}
          --config
        if: '{{eq .TARGET "local"}}'
      - cmd: >
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          "$(bunx --no-install bun pm bin)/rolldown"
          --dir {{.BUNDLE_DIST_DIR}}
          --config
        if: '{{ne .TARGET "local"}}'

  start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_DIST_DIR: './dist/{{.TARGET}}/{{.MODE}}/build'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.TARGET}}/{{.MODE}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build:with-ssg
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    cmds:
      - cmd: >
          SWAPI_SERVER_PORT=51000
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          {{.BUILD_DIST_DIR}}/server.js
        if: '{{and (eq .MODE "production") (eq .TARGET "local")}}'
      - cmd: >
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          {{.BUILD_DIST_DIR}}/server.js
        if: '{{and (eq .MODE "production") (ne .TARGET "local")}}'
      - cmd: >
          SWAPI_SERVER_PORT=50000
          bunx --no-install bun
          --conditions @swapi/source
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          ./src/server.ts
        if: '{{and (eq .MODE "development") (eq .TARGET "local")}}'
      - cmd: >
          bunx --no-install bun
          --conditions @swapi/source
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          ./src/server.ts
        if: '{{and (eq .MODE "development") (ne .TARGET "local")}}'

  start:bundle:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUNDLE_DIST_DIR: './dist/{{.TARGET}}/{{.MODE}}/bundle'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.TARGET}}/{{.MODE}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: bundle
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.base
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    cmds:
      - cmd: >
          SWAPI_SERVER_PORT={{if eq .MODE "development"}}50000{{else}}51000{{end}}
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          {{.BUNDLE_DIST_DIR}}/server.js
        if: '{{eq .TARGET "local"}}'
      - cmd: >
          bunx --no-install bun
          --conditions {{.TARGET_AND_MODE_CONDITION}}
          --conditions {{.MODE_CONDITION}}
          {{.BUNDLE_DIST_DIR}}/server.js
        if: '{{ne .TARGET "local"}}'
