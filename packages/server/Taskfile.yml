version: 3

tasks:
  clean:
    cmds:
      - rm -f ./tsconfig/*.tsbuildinfo || true
      - rm -rf ./.cache || true
      - rm -rf ./.task || true
      - rm -rf ./dist || true

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: :shared:generate
    sources:
      - '{{.TSCONFIG}}'
      - ./tsconfig/tsconfig.server.docker.json
      - ./src/**/*
      - ./docker/**/*
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'
      - bunx --no-install tsc --project ./tsconfig/tsconfig.server.docker.json

  dev:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: :client:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: local
    dotenv:
      - ./.env/.env.target.local
      - ./.env/.env.output.{{.MODE}}
    interactive: true
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/shared/source
        --conditions @swapi/server/source
        --conditions @swapi/local/{{.MODE}}
        --watch ./src/server.ts

  build:with-ssg:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_VARIANT_PATH: '{{.TARGET}}/{{.MODE}}'
      BUILD_DIST_DIR: './dist/{{.BUILD_VARIANT_PATH}}/build'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.BUILD_VARIANT_PATH}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
      CLIENT_DIST_ROOT: '../client/dist/{{.BUILD_VARIANT_PATH}}'
      CLIENT_SSG_DIST_DIR: '{{.CLIENT_DIST_ROOT}}/ssg'
      CLIENT_SSR_ENTRY: '{{.CLIENT_DIST_ROOT}}/ssr/main.server.js'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    sources:
      - '{{.TSCONFIG}}'
      - ./package.json
      - ./.env/.env.output.{{.MODE}}
      - ./.env/.env.target.{{.TARGET}}
      - '{{.BUILD_DIST_DIR}}/prerender.js'
      - '{{.CLIENT_SSR_ENTRY}}'
    generates:
      - '{{.CLIENT_SSG_DIST_DIR}}/index.html'
      - '{{.CLIENT_SSG_DIST_DIR}}/**/*/index.html'
    cmds:
      - >
        bunx --no-install bun
        --conditions {{.TARGET_AND_MODE_CONDITION}}
        --conditions {{.MODE_CONDITION}}
        {{.BUILD_DIST_DIR}}/prerender.js

  build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build:compile
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
      - task: :client:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}

  build:compile:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_VARIANT_PATH: '{{.TARGET}}/{{.MODE}}'
      BUILD_DIST_DIR: './dist/{{.BUILD_VARIANT_PATH}}/build'
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: :shared:build
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    sources:
      - '{{.TSCONFIG}}'
      - ./package.json
      - ./.env/.env.output.{{.MODE}}
      - ./.env/.env.target.{{.TARGET}}
      - ./src/**/*
    generates:
      - '{{.BUILD_DIST_DIR}}/**/*'
    cmds:
      - >
        bunx --no-install tsc
        --project '{{.TSCONFIG}}'
        --outDir '{{.BUILD_DIST_DIR}}'

  bundle:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_VARIANT_PATH: '{{.TARGET}}/{{.MODE}}'
      DIST_ROOT: './dist/{{.BUILD_VARIANT_PATH}}'
      BUILD_DIST_DIR: '{{.DIST_ROOT}}/build'
      BUNDLE_DIST_DIR: '{{.DIST_ROOT}}/bundle'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.BUILD_VARIANT_PATH}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build:with-ssg
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    sources:
      - ./tsconfig/tsconfig.server.bundle.json
      - ./tsconfig/tsconfig.server.docker.json
      - ./rolldown.config.ts
      - ./docker/**/*.ts
      - '{{.BUILD_DIST_DIR}}/**/*'
    generates:
      - '{{.BUNDLE_DIST_DIR}}/**/*'
    cmds:
      - >
        bunx --no-install bun
        --conditions {{.TARGET_AND_MODE_CONDITION}}
        --conditions {{.MODE_CONDITION}}
        "$(bunx --no-install bun pm bin)/rolldown"
        --config

  start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_VARIANT_PATH: '{{.TARGET}}/{{.MODE}}'
      BUILD_DIST_DIR: './dist/{{.BUILD_VARIANT_PATH}}/build'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.BUILD_VARIANT_PATH}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: build:with-ssg
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    cmds:
      - >
        bunx --no-install bun
        --conditions {{.TARGET_AND_MODE_CONDITION}}
        --conditions {{.MODE_CONDITION}}
        {{.BUILD_DIST_DIR}}/server.js

  start:bundle:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      BUILD_VARIANT_PATH: '{{.TARGET}}/{{.MODE}}'
      BUNDLE_DIST_DIR: './dist/{{.BUILD_VARIANT_PATH}}/bundle'
      TARGET_AND_MODE_CONDITION: '@swapi/{{.BUILD_VARIANT_PATH}}'
      MODE_CONDITION: '@swapi/{{.MODE}}'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, testing, production]
    deps:
      - task: bundle
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./.env/.env.target.{{.TARGET}}
      - ./.env/.env.output.{{.MODE}}
    cmds:
      - >
        bunx --no-install bun
        --conditions {{.TARGET_AND_MODE_CONDITION}}
        --conditions {{.MODE_CONDITION}}
        {{.BUNDLE_DIST_DIR}}/server.js
