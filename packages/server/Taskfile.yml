version: 3

tasks:
  clean:
    cmds:
      - rm -f ./tsconfig/*.tsbuildinfo || true
      - rm -rf ./.cache || true
      - rm -rf ./.task || true
      - rm -rf ./dist || true

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TSCONFIG: './tsconfig/tsconfig.server.lint{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: :shared:generate
    sources:
      - '{{.TSCONFIG}}'
      - ./src/**/*
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'

  dev:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: :client:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    interactive: true
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/source
        --watch ./src/server.ts

  build:with-ssg:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    sources:
      - '{{.TSCONFIG}}'
      - ./package.json
      - ./env/.env.output.{{.MODE}}
      - ./env/.env.target.{{.TARGET}}
      - ./src/prerender.ts
    generates:
      - ../client/dist/ssg/**/*/index.html
      - ../client/dist/ssg/.build-mode-{{.MODE}}
    cmds:
      - bunx --no-install bun ./dist/build/prerender.js
      - touch ../client/dist/ssg/.build-mode-{{.MODE}}

  build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: build:compile
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
      - task: :client:build
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}

  build:compile:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: :shared:build
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    sources:
      - '{{.TSCONFIG}}'
      - ./package.json
      - ./env/.env.output.{{.MODE}}
      - ./env/.env.target.{{.TARGET}}
      - ./src/**/*
    generates:
      - ./dist/build/**/*
      - ./dist/build/.build-mode-{{.MODE}}
    cmds:
      - bunx --no-install tsc --project '{{.TSCONFIG}}'
      - touch ./dist/build/.build-mode-{{.MODE}}

  bundle:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: build:with-ssg
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./tsconfig/tsconfig.server.bundle.json
      - ./rolldown.config.ts
    generates:
      - ./dist/bundle/**/*
      - ./dist/bundle/.build-mode-{{.MODE}}
    cmds:
      - bunx --no-install rolldown --dir ./dist/bundle --config
      - touch ./dist/bundle/.build-mode-{{.MODE}}

  start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: build:with-ssg
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    cmds:
      - cmd: bunx --no-install bun ./dist/build/server.js
        if: '{{eq .MODE "production"}}'
      - cmd: bunx --no-install bun --conditions @swapi/source ./src/server.ts
        if: '{{eq .MODE "development"}}'

  start:bundle:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TARGET:
        ref: .SWAPI_TARGET | default .TARGET | default "local"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
        - name: TARGET
          enum: [local, test, production]
    deps:
      - task: bundle
        vars:
          MODE: '{{.MODE}}'
          TARGET: '{{.TARGET}}'
    dotenv:
      - ./env/.env.target.{{.TARGET}}
      - ./env/.env.output.{{.MODE}}
    cmds:
      - bunx --no-install bun ./dist/bundle/server.js
