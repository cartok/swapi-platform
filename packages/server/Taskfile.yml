version: '3'
run: once
set: [pipefail]

includes:
  client:
    taskfile: ../client
    dir: ../client

tasks:
  dev:
    cmds:
      - task: dev:start

  dev:ssg:
    cmds:
      - rm -rf ./dist/dev || true
      - bunx --no-install tsx ./src/prerender.ts

  dev:start:
    cmds:
      - bunx --no-install tsx --watch ./src/server.ts

  build:
    cmds:
      - bunx --no-install tsc ./src/server.ts
