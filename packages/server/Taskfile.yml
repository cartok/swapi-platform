version: 3

includes:
  client:
    taskfile: ../client
    dir: ../client
    internal: true
  shared:
    taskfile: ../shared
    dir: ../shared
    internal: true

tasks:
  clean:
    cmds:
      - rm -f ./*.tsbuildinfo || true
      - rm -rf ./.cache || true
      - rm -rf ./dist || true

  dev:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: client:build
        vars:
          MODE: '{{.MODE}}'
      - task: ssg
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./{src,env}/**/*
      - ./env/.env.output.{{.MODE}}
    interactive: true
    cmds:
      - >
        bunx --no-install bun
        --conditions @swapi/source
        --watch ./src/server.ts

  build:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: shared:build
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./{src,env}/**/*
      - ./env/.env.output.{{.MODE}}
    generates:
      - ./dist/**/*
    preconditions:
      - test -s '{{.TSCONFIG}}'
    cmds:
      - bunx --no-install tsc --project '{{.TSCONFIG}}'
      - touch ./dist/.build-mode-{{.MODE}}

  ssg:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: build
        vars:
          MODE: '{{.MODE}}'
      - task: client:build
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    sources:
      - ./{src,env}/**/*
      - ./env/.env.output.{{.MODE}}
    generates:
      - ../client/dist/ssg/**/*/index.html
      - ../client/dist/ssg/.ssg-mode-{{.MODE}}
    cmds:
      - bunx --no-install bun ./dist/prerender.js
      - touch ../client/dist/ssg/.ssg-mode-{{.MODE}}

  start:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "production"
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    deps:
      - task: build
        vars:
          MODE: '{{.MODE}}'
      - task: client:build
        vars:
          MODE: '{{.MODE}}'
      - task: ssg
        vars:
          MODE: '{{.MODE}}'
    dotenv:
      - ./env/.env.target.local
      - ./env/.env.output.{{.MODE}}
    cmds:
      - cmd: bunx --no-install bun ./dist/server.js
        if: '{{eq .MODE "production"}}'
      - cmd: bunx --no-install bun --conditions @swapi/source ./src/server.ts
        if: '{{eq .MODE "development"}}'

  lint:
    vars:
      MODE:
        ref: .SWAPI_OUTPUT_MODE | default .MODE | default "development"
      TSCONFIG: './tsconfig/tsconfig.server{{if eq .MODE "production"}}.production{{end}}.json'
    requires:
      vars:
        - name: MODE
          enum: [development, production]
    sources:
      - '{{.TSCONFIG}}'
      - ./src/**/*
    cmds:
      - bunx --no-install tsc --noEmit --project '{{.TSCONFIG}}'
