kill_timeout: ${BUILD_FLY_KILL_TIMEOUT}s

checks:
  alife:
    RUN_PORT: ${RUN_PORT}
    timeout: ${BUILD_FLY_CHECK_ALIFE_TIMEOUT}s
    headers:
      X-Secret-Health-Check-Token: ${SECRET_HEALTH_CHECK_TOKEN}

  errors:
    RUN_PORT: ${RUN_PORT}
    timeout: ${BUILD_FLY_CHECK_ERRORS_TIMEOUT}s
    headers:
      X-Secret-Health-Check-Token: ${SECRET_HEALTH_CHECK_TOKEN}

  ssr:
    RUN_PORT: ${RUN_PORT}
    timeout: ${BUILD_FLY_CHECK_SSR_TIMEOUT}s
    headers:
      X-Secret-Health-Check-Token: ${SECRET_HEALTH_CHECK_TOKEN}

http_service:
  internal_port: ${RUN_PORT}
  concurrency:
    soft_limit: ${BUILD_FLY_REQUEST_SOFT_LIMIT}
    hard_limit: ${BUILD_FLY_REQUEST_HARD_LIMIT}
  checks:
    - timeout: ${BUILD_FLY_SERVICE_CHECK_READY_TIMEOUT}s
      headers:
        X-Secret-Health-Check-Token: ${SECRET_HEALTH_CHECK_TOKEN}
