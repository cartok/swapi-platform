version: 3

vars:
  APP_SERVER_FLY_CONFIG: '{{.ROOT_DIR}}/fly.yaml'

tasks:
  generate-secret:
    silent: true
    preconditions:
      - command -v zsh
      - command -v openssl
      - command -v wl-copy
    cmd: |
      zsh -c '
        secret="$(openssl rand -base64 32)"
        wl-copy -- "${secret}" >/dev/null 2>&1
        result=$?
        if (( ${result} == 0 )); then
          print -- "A secret was generated and copied to your clipboard."
        else
          exit ${result}
        fi
      '

  stage-secrets:
    silent: true
    dotenv:
      - '{{.ROOT_DIR}}/.env.fly.secret'
    preconditions:
      - command -v openssl
      - command -v fly
      - test -s {{.APP_SERVER_FLY_CONFIG}}
      - test -n "${SECRET_HEALTH_CHECK_TOKEN}"
      - test -n "${SECRET_SSG_RENDER_TOKEN}"
      - printf '%s' "${SECRET_HEALTH_CHECK_TOKEN}" | openssl base64 -d -A >/dev/null 2>&1
      - printf '%s' "${SECRET_SSG_RENDER_TOKEN}" | openssl base64 -d -A >/dev/null 2>&1
    cmds:
      - |
        {
          printf 'SECRET_HEALTH_CHECK_TOKEN=%s\n' "${SECRET_HEALTH_CHECK_TOKEN}"
          printf 'SECRET_SSG_RENDER_TOKEN=%s\n' "${SECRET_SSG_RENDER_TOKEN}"
        } | fly secrets import --config {{.APP_SERVER_FLY_CONFIG}} --stage

  build-config:
    silent: true
    requires:
      vars:
        - name: BUILD_PROFILE
          enum: [release, development]
        - name: TARGET_ENVIRONMENT
          enum: [testing, production]
    vars:
      CONFIG_TEMPLATE: ./fly.template.yaml
      CONFIG_VARIABLES: ./fly.variables.yaml
      CONFIG_TEMPLATE_COPY:
        sh: mktemp /tmp/fly.template.copy.XXXXXX.yaml
      CONFIG_VARIABLES_COPY:
        sh: mktemp /tmp/fly.variables.copy.XXXXXX.yaml
      CONFIG_VARIABLES_COPY_ENV:
        sh: mktemp /tmp/fly.variables.copy.env.XXXXXX.yaml
    dotenv:
      - '{{.ROOT_DIR}}/.env.fly.secret'
      - './.env/.env.{{.TARGET_ENVIRONMENT}}.{{.BUILD_PROFILE}}'
    preconditions:
      - sh: command -v yq && yq --version | rg 'mikefarah'
        msg: 'You need to install `yq` (https://github.com/mikefarah/yq).'
      - sh: command -v envsubst
        msg: 'You need to install `gettext` to get the `envsubst` utility.'
      - sh: command -v shred
        msg: 'You need to install `coreutils` to get the `shred` utility.'
      - command -v openssl
      - command -v fly
      - test -s {{.CONFIG_TEMPLATE}}
      - test -s {{.CONFIG_VARIABLES}}
      - test -n "${SECRET_HEALTH_CHECK_TOKEN}"
      - test -n "${SECRET_SSG_RENDER_TOKEN}"
      - printf '%s' "${SECRET_HEALTH_CHECK_TOKEN}" | openssl base64 -d -A >/dev/null 2>&1
      - printf '%s' "${SECRET_SSG_RENDER_TOKEN}" | openssl base64 -d -A >/dev/null 2>&1
    cmds:
      - defer: >
          shred -u
          {{.CONFIG_VARIABLES_COPY}}
          {{.CONFIG_TEMPLATE_COPY}}
          {{.CONFIG_VARIABLES_COPY_ENV}}
      - yq '... comments=""' < {{.CONFIG_TEMPLATE}} > {{.CONFIG_TEMPLATE_COPY}}
      - yq '... comments=""' < {{.CONFIG_VARIABLES}} > {{.CONFIG_VARIABLES_COPY}}
      - envsubst < {{.CONFIG_VARIABLES_COPY}} > {{.CONFIG_VARIABLES_COPY_ENV}}
      - >
        yq --null-input
        'load("{{.CONFIG_TEMPLATE_COPY}}") *d load("{{.CONFIG_VARIABLES_COPY_ENV}}")'
        > '{{.APP_SERVER_FLY_CONFIG}}'
      - echo 'Built config {{.APP_SERVER_FLY_CONFIG}}.'
      - flyctl config validate --config {{.APP_SERVER_FLY_CONFIG}}

  deploy:
    requires:
      vars:
        - name: BUILD_PROFILE
          enum: [release, development]
        - name: TARGET_ENVIRONMENT
          enum: [testing, production]
        - name: TEST_LOCAL_DOCKER_BUILD
          enum: ['true', 'false']
    dotenv:
      - '{{.ROOT_DIR}}/.env.fly.secret'
      - './.env/.env.{{.TARGET_ENVIRONMENT}}.{{.BUILD_PROFILE}}'
    preconditions:
      - command -v fly
      - sh: command -v shred
        msg: 'You need to install `coreutils` to get the `shred` utility.'
    deps:
      - task: build-config
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          TARGET_ENVIRONMENT: '{{.TARGET_ENVIRONMENT}}'
    cmds:
      - task: stage-secrets
      - task: :lint
      - task: :server:build:docker
        if: '{{eq .TEST_LOCAL_DOCKER_BUILD "true"}}'
        vars:
          BUILD_PROFILE: '{{.BUILD_PROFILE}}'
          TARGET_ENVIRONMENT: local
          DOCKER_TARGET: runtime
          DEV_MODE: 'false'
      - |
        # Set max-per-region to 2 to allow `canary` deployment.
        fly scale --config {{.APP_SERVER_FLY_CONFIG}} count 1 --max-per-region 2
      - >
        fly deploy
        --config {{.APP_SERVER_FLY_CONFIG}}
        --build-arg NODE_ENV=${NODE_ENV}
        --build-arg BUILD_PROFILE={{.BUILD_PROFILE}}
        --build-arg TARGET_ENVIRONMENT={{.TARGET_ENVIRONMENT}}
        --build-arg GIT_COMMIT_SHA={{.GIT_COMMIT_SHA}}
        --compression zstd
        --compression-level 7
        {{.CLI_ARGS}}
      - |
        sleep 5
        fly doctor
        fly status
        fly checks list
      - defer: |
          {{if .EXIT_CODE}}
          echo "Failed with {{.EXIT_CODE}}."
          fly logs
          {{else}}
          echo "Success!"
          {{end}}
