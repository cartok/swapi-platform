name: swapi-platform

services:
  app-server:
    image: ${APP_SERVER_DOCKER_IMAGE_REFERENCE}
    build:
      context: .
      dockerfile: ./packages/server/Dockerfile.app-server
      target: ${APP_SERVER_DOCKER_TARGET}
      args:
        BUILD_PROFILE: ${BUILD_PROFILE}
        BUN_VERSION: 1.3.14
        DOCKER_IMAGE_VARIANT: ${APP_SERVER_DOCKER_IMAGE_VARIANT}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}
        NODE_ENV: ${NODE_ENV}
        NODE_VERSION: 24.16.0
        TARGET_ENVIRONMENT: ${APP_TARGET_ENVIRONMENT}
      tags:
        - ${APP_SERVER_DOCKER_IMAGE_REFERENCE}
    ports:
      - ${APP_SERVER_PORT}:${APP_SERVER_PORT}
    env_file:
      - path: ./.env.fly.secret
        required: false
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - >
          (async () => {
            const headers = {};
            if (process.env.SECRET_HEALTH_CHECK_TOKEN) {
              headers['X-Secret-Health-Check-Token'] =
                process.env.SECRET_HEALTH_CHECK_TOKEN;
            }
            const response = await fetch(
              'http://localhost:' + process.env.RUN_PORT + '/status/ready',
              { headers },
            );
            process.exit(response.ok ? 0 : 1);
          })().catch(() => process.exit(1));
      start_period: 15s
      start_interval: 3s
      timeout: 2s
      interval: 1m
      retries: 1
    init: true
