name: swapi-platform

x-build-args-common: &build-args-common
  NODE_VERSION: 24.16.0
  BUN_VERSION: 1.3.14
  # TODO: SWAPI_ präfixe aus dockerfiles & allgemein build time variablen entfernen
  SWAPI_GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA is required}

services:
  app-server:
    image: ${APP_SERVER_DOCKER_IMAGE_REFERENCE}
    container_name: ${APP_SERVER_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./packages/server/Dockerfile.app-server
      target: ${APP_SERVER_DOCKER_TARGET}
      args:
        # TODO: SWAPI_ präfixe aus dockerfiles & allgemein build time variablen entfernen
        <<: *build-args-common
        NODE_ENV: ${APP_SERVER_NODE_ENV}
        SWAPI_BUILD_LEVEL: ${APP_SERVER_BUILD_LEVEL}
        SWAPI_TARGET_ENVIRONMENT: ${APP_SERVER_TARGET_ENVIRONMENT}
        RUNTIME_IMAGE_VARIANT: ${APP_SERVER_DOCKER_RUNTIME_IMAGE_VARIANT}
      tags:
        - ${APP_SERVER_DOCKER_IMAGE_REFERENCE}
    environment:
      NODE_ENV: ${APP_SERVER_NODE_ENV}
      SWAPI_BUILD_LEVEL: ${APP_SERVER_BUILD_LEVEL}
      SWAPI_TARGET_ENVIRONMENT: ${APP_SERVER_TARGET_ENVIRONMENT}
    env_file: ${APP_SERVER_RUN_ENV_FILE}
    ports:
      - ${APP_SERVER_PORT}:${APP_SERVER_PORT}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --head
        - http://localhost:${APP_SERVER_PORT}/health/ready
      start_period: 15s
      start_interval: 3s
      timeout: 2s
      interval: 1m
      retries: 1
    init: true

