version: 3

vars:
  TOOLS:
    map:
      eslint:
        cacheLocation: ./.cache/.eslint
      prettier:
        cacheLocation: ./.cache/.prettier

tasks:
  tally:lint:
    summary: |
      Slow checks are turned off, cause tally is currently unable to do so if image names
      are built from variables like `FROM oven/bun:${BUN_VERSION}-slim AS deps`.
    sources: &tally-sources
      - './.dockerignore'
      - './.tally.toml'
      - './package.json'
      - './packages/*/Dockerfile*'
      - '{{.SOURCES.lockfile}}'
    cmds:
      - bunx --no-install tally lint --exclude '.dev/**' --slow-checks off

  tally:fix:
    sources: *tally-sources
    cmds:
      - bunx --no-install tally lint --exclude '.dev/**' --slow-checks off --fix

  tsc:lint:
    deps:
      - task: :client:lint:tsc
      - task: :e2e:lint:tsc
      - task: :hono:lint:tsc
      - task: :server:lint:tsc
      - task: :shared:lint:tsc
      - task: :worker:lint:tsc

  eslint:lint:
    requires:
      vars:
        - DIR
    vars:
      DIR: '{{coalesce .DIR .CLI_ARGS .ROOT_DIR}}'
    generates:
      - '{{.TOOLS.eslint.cacheLocation}}'
    cmds:
      - >
        bunx --no-install eslint
        --cache
        --cache-location {{.TOOLS.eslint.cacheLocation}}
        --concurrency auto
        --exit-on-fatal-error
        {{.DIR | q}}

  eslint:fix:
    requires:
      vars:
        - DIR
    vars:
      DIR: '{{coalesce .DIR .CLI_ARGS .ROOT_DIR}}'
    generates:
      - '{{.TOOLS.eslint.cacheLocation}}'
    cmds:
      - >
        bunx --no-install eslint
        --cache
        --cache-location {{.TOOLS.eslint.cacheLocation}}
        --concurrency auto
        --exit-on-fatal-error
        --fix
        {{.DIR | q}}

  prettier:lint:
    requires:
      vars:
        - DIR
    vars:
      DIR: '{{coalesce .DIR .CLI_ARGS .ROOT_DIR}}'
    cmds:
      - >
        bunx --no-install prettier
        --cache
        --cache-location {{.TOOLS.prettier.cacheLocation}}
        --check
        {{.DIR | q}}

  prettier:fix:
    requires:
      vars:
        - DIR
    vars:
      DIR: '{{coalesce .DIR .CLI_ARGS .ROOT_DIR}}'
    generates:
      - '{{.TOOLS.prettier.cacheLocation}}'
    cmds:
      - >
        bunx --no-install prettier
        --cache
        --cache-location {{.TOOLS.prettier.cacheLocation}}
        --write
        --list-different
        {{.DIR | q}}

  docker:show-targets:
    silent: true
    requires:
      vars:
        - name: DOCKER_FILE
          enum:
            - e2e
            - app-server
            - app-worker
        - name: FORMAT
          enum: [text, json]
    vars:
      DOCKER_FILE_MAP:
        map:
          e2e: ./packages/e2e/Dockerfile.e2e
          app-server: ./packages/server/Dockerfile.app-server
          app-worker: ./packages/worker/Dockerfile.app-worker
    cmds:
      - >
        docker buildx build
        --quiet
        --call=targets,format={{.FORMAT}}
        --file {{get .DOCKER_FILE_MAP .DOCKER_FILE}}
        {{.ROOT_DIR}}
        {{if eq .FORMAT "text"}}
        | tail -n +2
        {{end}}
