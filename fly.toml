app = 'swapi-platform'
primary_region = 'fra'

[build]
  [build.args]
    MODE="development"
    TARGET="testing"

[http_service]
  internal_port = 51000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 30
    hard_limit = 50

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
