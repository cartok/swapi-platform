app = 'swapi-platform'
primary_region = 'fra'

[build]
  [build.args]
    PROFILE="release"
    TARGET="testing"

[http_service]
  internal_port = 51000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 60
    hard_limit = 100

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512MB'
  cpu_kind = 'shared'
  cpus = 1
