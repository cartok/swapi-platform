app: swapi-platform
primary_region: fra

kill_signal: SIGUSR2

deploy:
  strategy: rolling

vm:
  - size: shared-cpu-1x
    memory: 512MB
    cpu_kind: shared
    cpus: 1

checks:
  alife:
    type: http
    interval: 30s
    grace_period: 2s
    method: HEAD
    path: /status/alife
    headers:
      X-Forwarded-Proto: https

  errors:
    type: http
    interval: 2m
    grace_period: 4s
    method: GET
    path: /status/errors
    headers:
      X-Forwarded-Proto: https

  ssr:
    port: 51000
    type: http
    interval: 3m
    grace_period: 6s
    method: GET
    path: /status/ssr
    headers:
      X-Forwarded-Proto: https

http_service:
  force_https: true
  auto_stop_machines: suspend
  auto_start_machines: true
  min_machines_running: 0
  processes:
    - app
  concurrency:
    type: requests
  checks:
    - interval: 30s
      grace_period: 12s
      method: GET
      path: /status/ready
      headers:
        X-Forwarded-Proto: https
