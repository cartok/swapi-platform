app: swapi-platform
primary_region: fra

kill_signal: SIGUSR2
kill_timeout: 8s

deploy:
  strategy: rolling

vm:
  - size: shared-cpu-1x
    memory: 256MB
    cpu_kind: shared
    cpus: 1

checks:
  alife:
    port: 51000
    type: http
    interval: 30s
    timeout: 2s
    grace_period: 2s
    method: HEAD
    path: /status/alife

    headers:
      X-Forwarded-Proto: https
      X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}

  errors:
    port: 51000
    type: http
    interval: 2m
    timeout: 2s
    grace_period: 4s
    method: GET
    path: /status/errors

    headers:
      X-Forwarded-Proto: https
      X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}

  # swapi:
  #   port: 51000
  #   type: http
  #   interval: 5m
  #   timeout: 2s
  #   grace_period: 6s
  #   method: GET
  #   path: /status/api/swapi

  #   headers:
  #     X-Forwarded-Proto: https
  #     X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}

  ssr:
    port: 51000
    type: http
    interval: 3m
    timeout: 2s
    grace_period: 8s
    method: GET
    path: /status/ssr

    headers:
      X-Forwarded-Proto: https
      X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}

http_service:
  internal_port: 51000
  force_https: true
  auto_stop_machines: suspend
  auto_start_machines: true
  min_machines_running: 0

  processes:
    - app

  concurrency:
    type: requests
    soft_limit: 10
    hard_limit: 20

  checks:
    - interval: 30s
      timeout: 5s
      grace_period: 10s
      method: GET
      path: /status/ready

      headers:
        X-Forwarded-Proto: https
        X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}
