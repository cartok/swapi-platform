app: swapi-platform
primary_region: fra
kill_signal: SIGUSR2
kill_timeout: 8s

deploy:
  strategy: rolling

http_service:
  internal_port: 51000
  force_https: true
  auto_stop_machines: suspend
  auto_start_machines: true
  min_machines_running: 0

  processes:
    - app

  concurrency:
    type: requests
    hard_limit: 40
    soft_limit: 20

  checks:
    - interval: 15s
      timeout: 2s
      grace_period: 15s
      method: GET
      path: /status/ready

      headers:
        X-Forwarded-Proto: https
        X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}

checks:
  status_live:
    port: 51000
    type: http
    interval: 30s
    timeout: 2s
    grace_period: 15s
    method: HEAD
    path: /status/live

    headers:
      X-Forwarded-Proto: https
      X-Secret-Health-Check-Token: ${SWAPI_SECRET_HEALTH_CHECK_TOKEN}

vm:
  - size: shared-cpu-1x
    memory: 256MB
    cpu_kind: shared
    cpus: 1
